<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sovereign Lab — Public Network Topology v1.0</title>
  <style>
    @page { size: landscape; margin: 0.15in; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; }
    @media print {
      html, body { height: 100%; background: white !important; }
      .no-print { display: none !important; }
      .page {
        box-shadow: none !important; border-radius: 0 !important;
        margin: 0 !important; padding: 4px 8px 2px !important;
        width: 100% !important; max-width: 100% !important;
        height: 100vh; display: flex; flex-direction: column;
      }
      .hdr { flex-shrink: 0; margin-bottom: 4px !important; padding-bottom: 4px !important; }
      .hdr h1 { font-size: 14px !important; }
      .hdr .sub, .hdr .meta { font-size: 8px !important; }
      .footer { flex-shrink: 0; margin-top: 2px !important; }
      svg.topo { flex: 1; width: 100% !important; max-width: 100% !important; height: 100% !important; min-height: 0; }
    }
    .page {
      width: 1040px; max-width: 100%; margin: 12px auto; background: white;
      border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,.1);
      padding: 14px 20px 10px;
    }
    .hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
    .hdr h1 { font-size: 18px; font-weight: 800; color: #111827; letter-spacing: .5px; }
    .hdr .sub { font-size: 10.5px; color: #6b7280; margin-top: 1px; }
    .hdr .meta { font-size: 8.5px; color: #9ca3af; font-family: monospace; margin-top: 2px; }
    .print-btn { background: #2563eb; color: white; border: none; padding: 5px 12px; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .print-btn:hover { background: #1d4ed8; }
    svg.topo { display: block; margin: 0 auto; width: 100%; max-width: 960px; height: auto; }
    .label    { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #111827; }
    .sublabel { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9px; fill: #6b7280; }
    .iplabel  { font-family: 'Consolas', 'Courier New', monospace; font-size: 9px; fill: #374151; }
    .ts-label { font-family: 'Consolas', 'Courier New', monospace; font-size: 8.5px; fill: #ea580c; }
    .zone-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 700; }
    .footer { text-align: right; font-size: 7.5px; color: #9ca3af; margin-top: 6px; font-family: monospace; }
  </style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div>
      <h1>SOVEREIGN LAB</h1>
      <div class="sub">Logical Network Topology — Public Architecture View</div>
      <div class="meta">Sovereign Lab Public Diagram &nbsp;|&nbsp; Version: v1.0</div>
    </div>
    <button class="print-btn no-print" onclick="window.print()">&#x1F5A8; Print</button>
  </div>

  <svg class="topo" viewBox="0 0 960 712" preserveAspectRatio="xMidYMin meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="ico-router">
        <circle cx="16" cy="16" r="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
        <path d="M8 16h16M16 8v16" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
        <path d="M10.5 10.5l2.5 2.5M21.5 10.5l-2.5 2.5M10.5 21.5l2.5-2.5M21.5 21.5l-2.5-2.5" stroke="#ef4444" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g id="ico-switch">
        <rect x="1" y="6" width="30" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="8" cy="13" r="2" fill="#3b82f6"/><circle cx="16" cy="13" r="2" fill="#3b82f6"/><circle cx="24" cy="13" r="2" fill="#3b82f6"/>
      </g>
      <g id="ico-server">
        <rect x="4" y="2" width="24" height="28" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
        <line x1="4" y1="12" x2="28" y2="12" stroke="#22c55e" stroke-width=".8"/>
        <line x1="4" y1="21" x2="28" y2="21" stroke="#22c55e" stroke-width=".8"/>
        <circle cx="10" cy="7" r="1.5" fill="#22c55e"/><circle cx="10" cy="16.5" r="1.5" fill="#22c55e"/><circle cx="10" cy="25.5" r="1.5" fill="#22c55e"/>
      </g>
      <g id="ico-lxc">
        <rect x="4" y="4" width="24" height="24" rx="3" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
        <rect x="8" y="8" width="16" height="16" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2"/>
        <circle cx="16" cy="16" r="3" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
      </g>
      <g id="ico-ws">
        <rect x="4" y="4" width="24" height="16" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
        <rect x="6" y="6" width="20" height="12" rx="1" fill="#e2e8f0"/>
        <path d="M10 22h12M14 20h4v2h-4z" fill="#475569"/>
      </g>
      <g id="ico-laptop">
        <path d="M6 6h20v12H6z" fill="#f8fafc" stroke="#475569" stroke-width="1.5" rx="1"/>
        <path d="M3 18h26v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2z" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
      </g>
      <g id="ico-mobile">
        <rect x="8" y="2" width="16" height="28" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
        <line x1="13" y1="26" x2="19" y2="26" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <g id="ico-ups">
        <rect x="4" y="4" width="24" height="24" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <path d="M16 9l-4 7h8l-4 7" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </defs>

    <!-- ═══════════════════════════════════════════ -->
    <!--  INTERNET CLOUD                             -->
    <!-- ═══════════════════════════════════════════ -->
    <ellipse cx="480" cy="18" rx="50" ry="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="480" y="22" text-anchor="middle" class="label" style="font-size:11px; fill:#1e40af;">Internet</text>

    <!-- WAN link (extends to meet router at y=72) -->
    <line x1="480" y1="34" x2="480" y2="70" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="476,68 484,68 480,74" fill="#3b82f6"/>

    <!-- ═══════════════════════════════════════════ -->
    <!--  PHYSICAL LAN ZONE (left)                   -->
    <!-- ═══════════════════════════════════════════ -->
    <rect x="12" y="50" width="220" height="510" rx="7" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,3"/>
    <rect x="20" y="43" width="175" height="16" rx="3" fill="white"/>
    <text x="28" y="54" class="zone-title" fill="#1e40af">Physical LAN (192.168.0.0/24)</text>

    <!-- Bahamut -->
    <use href="#ico-ws" x="35" y="80"/>
    <text x="73" y="102" class="label">Bahamut</text>
    <text x="73" y="119" class="sublabel">Heavy Compute / Tier 3 Backup</text>
    <text x="73" y="135" class="iplabel">192.168.0.X</text>

    <!-- Leviathan -->
    <use href="#ico-laptop" x="33" y="162"/>
    <text x="73" y="184" class="label">Leviathan</text>
    <text x="73" y="201" class="sublabel">Management Workstation</text>
    <text x="73" y="217" class="ts-label">TS: 100.X.X.X</text>

    <!-- Tiamat -->
    <use href="#ico-mobile" x="38" y="242"/>
    <text x="73" y="267" class="label">Tiamat</text>
    <text x="73" y="283" class="sublabel">Mobile Command &amp; Control</text>
    <text x="73" y="299" class="ts-label">TS: 100.X.X.X</text>

    <!-- UPS -->
    <use href="#ico-ups" x="38" y="370"/>
    <text x="73" y="391" class="label" style="fill:#16a34a;">UPS</text>
    <text x="73" y="408" class="sublabel">1500VA / 900W &bull; NUT-Managed</text>

    <!-- Bahamut → Proxmox LAN link — exits icon top-right, routes above Bahamut text -->
    <polyline points="63,84 63,73 260,73" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="246" y="70" text-anchor="middle" class="sublabel" style="font-size:7px;">SMB</text>

    <!-- UPS → Proxmox power link — exits icon bottom, routes below UPS sublabel -->
    <polyline points="54,398 54,422 260,422" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="246" y="432" text-anchor="middle" class="sublabel" style="font-size:7px; fill:#16a34a;">NUT Power</text>

    <!-- ═══════════════════════════════════════════ -->
    <!--  PROXMOX HYPERVISOR ZONE (center-right)     -->
    <!-- ═══════════════════════════════════════════ -->
    <rect x="260" y="50" width="688" height="560" rx="7" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="8,4"/>
    <rect x="270" y="43" width="260" height="16" rx="3" fill="white"/>
    <text x="278" y="54" class="zone-title" fill="#1e293b">Proxmox VE 9.1.1 — Hypervisor Node</text>

    <!-- ═══════════════════════════════════════════ -->
    <!--  CORE ROUTER                                -->
    <!-- ═══════════════════════════════════════════ -->
    <use href="#ico-router" x="464" y="72"/>
    <text x="500" y="91" class="label" style="font-size:12px;">Core-Router</text>
    <text x="500" y="108" class="sublabel">LXC 100 &bull; FRRouting &bull; NAT &bull; Firewall</text>

    <!-- Router IP labels — right-anchored -->
    <text x="944" y="91" text-anchor="end" class="iplabel" style="font-size:8px;">WAN: 192.168.0.X</text>
    <text x="944" y="108" text-anchor="end" class="iplabel" style="font-size:8px; fill:#7c3aed;">VLAN10 GW: 10.0.10.1</text>
    <text x="944" y="124" text-anchor="end" class="iplabel" style="font-size:8px; fill:#059669;">VLAN20 GW: 10.0.20.1</text>

    <!-- Router → Switch -->
    <line x1="480" y1="119" x2="480" y2="157" stroke="#374151" stroke-width="2"/>

    <!-- ═══════════════════════════════════════════ -->
    <!--  VIRTUAL SWITCH                             -->
    <!-- ═══════════════════════════════════════════ -->
    <use href="#ico-switch" x="464" y="154"/>
    <text x="500" y="177" class="label" style="font-size:10px; fill:#2563eb;">vmbr1</text>
    <text x="530" y="177" class="sublabel">Internal Virtual Switch</text>

    <!-- Switch → VLAN 10 -->
    <line x1="480" y1="184" x2="390" y2="223" stroke="#8b5cf6" stroke-width="1.8"/>
    <polygon points="393,221 388,226 385,220" fill="#8b5cf6"/>

    <!-- Switch → VLAN 20 -->
    <line x1="480" y1="184" x2="700" y2="223" stroke="#22c55e" stroke-width="1.8"/>
    <polygon points="697,220 703,226 698,221" fill="#22c55e"/>

    <!-- ═══════════════════════════════════════════ -->
    <!--  VLAN 10: Admin / Infrastructure            -->
    <!-- ═══════════════════════════════════════════ -->
    <rect x="280" y="225" width="260" height="375" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="296" y="250" class="zone-title" fill="#5b21b6">VLAN 10 — Admin / Infrastructure</text>
    <text x="296" y="267" class="sublabel" style="fill:#7c3aed;">Subnet: 10.0.10.0/24</text>

    <!-- Sovereign-Ops -->
    <g transform="translate(295,280)">
      <use href="#ico-server" x="0" y="0"/>
      <text x="36" y="14" class="label">Sovereign-Ops</text>
      <text x="36" y="26" class="sublabel">VM 101 &bull; Management &amp; Automation Hub</text>
      <text x="36" y="38" class="iplabel">10.0.10.10</text>
      <text x="120" y="38" class="ts-label">TS: 100.X.X.X</text>
    </g>

    <!-- Technitium DNS -->
    <g transform="translate(295,382)">
      <use href="#ico-lxc" x="0" y="0"/>
      <text x="36" y="14" class="label">Technitium DNS</text>
      <text x="36" y="26" class="sublabel">LXC 104 &bull; Local Resolver (.sovereign.lab)</text>
      <text x="36" y="38" class="iplabel">10.0.10.53</text>
    </g>

    <!-- Netdata -->
    <g transform="translate(295,484)">
      <use href="#ico-lxc" x="0" y="0"/>
      <text x="36" y="14" class="label">Netdata</text>
      <text x="36" y="26" class="sublabel">LXC 103 &bull; Telemetry &amp; Health Monitoring</text>
      <text x="36" y="38" class="iplabel">10.0.10.20</text>
    </g>

    <!-- ═══════════════════════════════════════════ -->
    <!--  VLAN 20: User Services                     -->
    <!-- ═══════════════════════════════════════════ -->
    <rect x="565" y="225" width="260" height="205" rx="6" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.8"/>
    <text x="581" y="250" class="zone-title" fill="#065f46">VLAN 20 — User Services</text>
    <text x="581" y="267" class="sublabel" style="fill:#059669;">Subnet: 10.0.20.0/24</text>

    <!-- Ghost -->
    <g transform="translate(580,280)">
      <use href="#ico-lxc" x="0" y="0"/>
      <text x="36" y="14" class="label">Ghost</text>
      <text x="36" y="26" class="sublabel">LXC 102 &bull; Isolated User Workstation</text>
      <text x="36" y="38" class="iplabel">10.0.20.X</text>
      <text x="36" y="50" class="sublabel" style="font-size:8px; fill:#059669;">Strict Inbound Drop &bull; Isolated by Design</text>
    </g>

    <!-- ═══════════════════════════════════════════ -->
    <!--  BACKUP ARCHITECTURE (lower-right)          -->
    <!-- ═══════════════════════════════════════════ -->
    <rect x="580" y="448" width="230" height="137" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="596" y="470" class="label" style="font-size:10px; fill:#374151;">Backup Architecture</text>
    <line x1="596" y1="475" x2="795" y2="475" stroke="#e5e7eb" stroke-width="1"/>
    <text x="596" y="492" class="sublabel" style="font-size:8.5px;">&#x2460; Proxmox VZDump — local snapshots</text>
    <text x="596" y="508" class="sublabel" style="font-size:8.5px;">&#x2461; Vault_Backups — on-host HDD</text>
    <text x="596" y="524" class="sublabel" style="font-size:8.5px;">&#x2462; Bahamut — off-host SMB share</text>
    <text x="596" y="540" class="sublabel" style="font-size:8.5px;">&#x2463; Git-backed FRR configs (automated cron)</text>

    <!-- ═══════════════════════════════════════════ -->
    <!--  TAILSCALE OOB OVERLAY                      -->
    <!-- ═══════════════════════════════════════════ -->
    <rect x="12" y="622" width="936" height="52" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="28" y="645" class="zone-title" fill="#9a3412">Out-of-Band: Tailscale Zero-Trust Mesh (Encrypted Overlay)</text>
    <text x="28" y="661" class="sublabel" style="fill:#c2410c;">Bypasses WAN — Leviathan &amp; Tiamat &#x2192; Sovereign-Ops &amp; Proxmox Host remotely</text>
    <text x="936" y="645" text-anchor="end" class="ts-label" style="font-size:9px;">Proxmox: 100.X.X.X:8006</text>
    <text x="936" y="661" text-anchor="end" class="ts-label" style="font-size:9px;">Sovereign-Ops: 100.X.X.X:22</text>

    <!-- Tailscale dashed lines — routed through whitespace, 90° entry to objects -->
    <!-- Leviathan: exit left of laptop icon → spine at x=22 → down to OOB bar -->
    <polyline points="36,174 22,174 22,622" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/>
    <!-- Tiamat: exit left of mobile icon → spine at x=24 → down to OOB bar -->
    <polyline points="46,258 24,258 24,622" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/>
    <!-- OOB → Sovereign-Ops: rise through VLAN10 left margin strip → enter icon from left -->
    <polyline points="288,622 288,296 299,296" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/>
    <circle cx="299" cy="296" r="3" fill="#fb923c"/>

    <!-- ═══════════════════════════════════════════ -->
    <!--  LEGEND BAR                                 -->
    <!-- ═══════════════════════════════════════════ -->
    <rect x="12" y="682" width="936" height="24" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="24" y="699" class="sublabel" style="font-size:8px; fill:#374151; font-weight:600;">LEGEND:</text>

    <line x1="80" y1="695" x2="100" y2="695" stroke="#374151" stroke-width="2"/>
    <text x="104" y="699" class="sublabel" style="font-size:7.5px;">L2/L3 Link</text>

    <line x1="162" y1="695" x2="182" y2="695" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="186" y="699" class="sublabel" style="font-size:7.5px;">Physical LAN</text>

    <line x1="252" y1="695" x2="272" y2="695" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="276" y="699" class="sublabel" style="font-size:7.5px;">Tailscale OOB</text>

    <line x1="348" y1="695" x2="368" y2="695" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="372" y="699" class="sublabel" style="font-size:7.5px;">Power/NUT</text>

    <circle cx="428" cy="695" r="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="438" y="699" class="sublabel" style="font-size:7.5px;">Router</text>

    <rect x="478" y="689" width="10" height="10" rx="1.5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="492" y="699" class="sublabel" style="font-size:7.5px;">Switch</text>

    <rect x="528" y="689" width="10" height="10" rx="1.5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
    <text x="542" y="699" class="sublabel" style="font-size:7.5px;">VM</text>

    <rect x="562" y="689" width="10" height="10" rx="1.5" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="576" y="699" class="sublabel" style="font-size:7.5px;">LXC</text>

    <rect x="600" y="689" width="10" height="8" rx="1" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <text x="614" y="699" class="sublabel" style="font-size:7.5px;">Workstation</text>

    <rect x="674" y="689" width="8" height="10" rx="1.5" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <text x="686" y="699" class="sublabel" style="font-size:7.5px;">Mobile</text>

    <rect x="724" y="689" width="10" height="10" rx="1.5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="738" y="699" class="sublabel" style="font-size:7.5px;">UPS</text>
  </svg>

  <div class="footer">Public v1.0 &nbsp;|&nbsp; 2026-04-09 &nbsp;|&nbsp; Sovereign Lab Documentation Repository</div>
</div>
<script>
  var svg = document.querySelector('svg.topo');
  window.addEventListener('beforeprint', function() {
    svg.setAttribute('preserveAspectRatio', 'none');
  });
  window.addEventListener('afterprint', function() {
    svg.setAttribute('preserveAspectRatio', 'xMidYMin meet');
  });
</script>
</body>
</html>
